<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ngöndro Tracker</title>
<meta name="theme-color" content="#1a0f1f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="images/dorje-drolo.jpg">
<style>
  :root{
    --bg:#1a0f1f; --bg2:#241526; --card:#2c1a30; --line:#3d2540;
    --gold:#ffb020; --orange:#ff6a1a; --text:#f2e9e4; --textDim:#b8a8bd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  .hidden{display:none !important}
  #loginScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:linear-gradient(180deg, rgba(26,15,31,0.4), rgba(26,15,31,0.97)), url('images/dorje-drolo.jpg') center/cover}
  #loginScreen h1{color:var(--gold);font-size:22px}
  #loginForm{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
  #loginForm input{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px}
  #loginForm button{padding:12px;border-radius:10px;border:none;background:var(--orange);color:#1a0f1f;font-weight:700;font-size:16px}
  #loginMsg{margin-top:10px;color:var(--textDim);font-size:14px;min-height:20px}

  #app{max-width:520px;margin:0 auto;padding-bottom:70px}
  .topBar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:8px 14px}
  .buildTag{color:var(--textDim);font-size:10px;opacity:.6}
  #logoutBtn{background:none;border:1px solid var(--line);color:var(--textDim);border-radius:8px;padding:6px 10px;font-size:12px}

  .tabView{display:none;padding:0 14px}
  .tabView.active{display:block}

  .hero{border-radius:16px;height:190px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;background-size:cover;background-position:center 20%;margin-bottom:14px}
  .heroTitle{color:var(--gold);font-size:22px;font-weight:700}
  .heroSub{color:var(--textDim);font-size:13px}

  .focusCard{background:var(--card);border:1px solid var(--orange);border-radius:14px;padding:14px;margin-bottom:14px}
  .focusCard.done{text-align:center;border-color:var(--gold);color:var(--gold);font-weight:700}
  .focusPhase{color:var(--orange);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .focusName{font-size:18px;font-weight:700;margin:4px 0 8px}
  .focusSub{color:var(--textDim);font-size:13px;margin-top:6px}

  .statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .statCard{background:var(--card);border-radius:12px;padding:10px;text-align:center}
  .statNum{color:var(--gold);font-size:20px;font-weight:700}
  .statLbl{font-size:11px;color:var(--textDim)}
  .statSub{font-size:10px;color:var(--textDim);opacity:.7}

  .phaseCard{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
  .phaseTitle{font-size:14px;font-weight:600;margin-bottom:8px}
  .phaseSub{font-size:12px;color:var(--textDim);margin:2px 0 8px}

  .miniBar{height:8px;background:var(--bg2);border-radius:6px;overflow:hidden}
  .miniBarFill{height:100%;background:linear-gradient(90deg,var(--orange),var(--gold))}
  .miniBarFill.alt{background:linear-gradient(90deg,#6a3aff,#a06aff)}

  .teacherRow{display:flex;gap:8px;margin-top:10px}
  .teacherRow img{width:33.3%;border-radius:10px;object-fit:cover;height:90px}
  .teacherCaption{text-align:center;color:var(--textDim);font-size:12px;margin-top:6px;margin-bottom:20px}

  .sectionLabel{color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px;font-weight:700}

  details.acc{background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden;border:1px solid var(--line)}
  details.acc[open]{border-color:var(--orange)}
  summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:8px;font-weight:600}
  summary::-webkit-details-marker{display:none}
  summary::after{content:'▾';margin-left:auto;color:var(--textDim);transition:transform .15s}
  details[open] summary::after{transform:rotate(180deg)}
  .accOrder{background:var(--bg2);color:var(--gold);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .accName{flex:1}
  .badge{background:var(--orange);color:#1a0f1f;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
  .accBody{padding:0 14px 14px}
  .rotateNote{font-size:12px;color:var(--textDim);font-style:italic;margin:8px 0}
  .etapa{border-top:1px solid var(--line);padding:8px 0}
  .etapaName{font-weight:600;font-size:13px;color:var(--gold);margin-bottom:2px}
  .etapaText{font-size:13px;color:var(--text);line-height:1.4}

  .refugeImg{width:100%;border-radius:10px;margin:8px 0}

  .mantraPlayer{padding-top:4px}
  .mantraControls{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .mantraCount{font-size:12px;color:var(--textDim)}
  .mantraTarget{font-size:12px;color:var(--textDim);margin-bottom:10px}
  .mantraTarget input{background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:2px 4px}
  .mantraLine{border-top:1px solid var(--line);padding:8px 0}
  .mantraBo{font-weight:700;color:var(--gold);font-size:14px}
  .mantraEs{font-size:12px;color:var(--textDim);font-style:italic}

  .timerWidget{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
  .timerHead{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
  .timerHead input{width:60px;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px}
  .seg{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--line);color:var(--textDim)}
  .seg.segActive{color:var(--gold);font-weight:700}
  .seg.segDone{opacity:.4;text-decoration:line-through}
  .timerControls{display:flex;gap:8px;margin-top:10px}

  .btnGhost{background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font-size:13px}
  .btnPrimary{background:var(--orange);border:none;color:#1a0f1f;font-weight:700;border-radius:10px;padding:12px;font-size:15px;margin-top:6px}

  .regForm{display:flex;flex-direction:column;gap:10px;background:var(--card);padding:14px;border-radius:14px;margin-top:10px}
  .regForm label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--textDim)}
  .regForm input, .regForm select, .regForm textarea{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-size:15px}
  .checkRow{flex-direction:row !important;align-items:center;gap:8px !important}
  .regRow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);padding:10px 12px;border-radius:10px;margin-bottom:6px;font-size:13px}
  .btnDelete{background:none;border:none;color:#e0554a;font-size:20px;padding:10px 14px;margin:-6px -6px -6px 0;min-width:46px;min-height:46px;line-height:1}
  .regNote{font-size:12px;color:var(--textDim);margin-top:3px;white-space:pre-wrap}
.fieldHint{font-size:12px;color:var(--textDim);margin:-2px 0 6px}
.timerStatus{text-align:center;font-size:12px;color:var(--textDim);margin:6px 0 2px}
.btnMini{padding:4px 8px;font-size:12px}
#netMsg{background:#4a2420;color:#ffc9c2;border:1px solid #7a3a33;border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px}
#netMsg.hidden{display:none}
#syncMsg{background:#3a3220;color:#e8d6a0;border:1px solid #6b5a30;border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13px;cursor:pointer}
#syncMsg.hidden{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{background:#2a2622;border:1px solid #453d33;color:var(--textDim);border-radius:999px;padding:6px 12px;font-size:12px}
.chipOn{background:var(--gold);border-color:var(--gold);color:#1a1613;font-weight:600}
.retPlan:empty{display:none}
.retNote{font-size:12px;color:var(--textDim);margin:6px 0 8px;line-height:1.45}
.retSes{display:flex;justify-content:space-between;width:100%;background:#2a2622;border:1px solid #453d33;color:var(--text);border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px}
.retSesOn{border-color:var(--gold);color:var(--gold)}
.pendTag{color:#e8d6a0;font-size:11px}
.regMsg{font-size:13px;min-height:18px;text-align:center;margin-top:2px}
  .regMsg.ok{color:#7fd18a}
  .regMsg.err{color:#e0554a}
  .empty{color:var(--textDim);font-size:13px;padding:10px 0}

  .calHead{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:700}
  .calWeek{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--textDim);font-size:11px;margin-bottom:4px}
  .calGridInner{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .calCell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--card);font-size:12px}
  .calCell.empty{background:transparent}
  .calCell.l1{background:#5a3a1a}
  .calCell.l2{background:#8a4f18}
  .calCell.l3{background:var(--orange);color:#1a0f1f;font-weight:700}
  .calCell.today{box-shadow:inset 0 0 0 2px var(--gold)}
  #calDetail{margin-top:14px}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);border-top:1px solid var(--line);max-width:520px;margin:0 auto}
  .tabBtn{flex:1;background:none;border:none;color:var(--textDim);padding:10px 0;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tabBtn .ic{font-size:18px}
  .tabBtn.active{color:var(--gold)}
</style>
</head>
<body>

  <div id="loginScreen">
    <h1>Ngöndro Tracker</h1>
    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="tu correo" required>
      <button type="submit">Entrar con enlace mágico</button>
    </form>
    <div id="loginMsg"></div>
  </div>

  <div id="app" class="hidden">
    <div class="topBar"><span class="buildTag">build 7</span><button id="logoutBtn">Salir</button></div>
    <div id="netMsg" class="hidden"></div>
    <div id="syncMsg" class="hidden"></div>

    <div id="resumenView" class="tabView active"></div>
    <div id="practicarView" class="tabView"></div>
    <div id="registrarView" class="tabView"></div>
    <div id="calendarioView" class="tabView">
      <div id="calGrid"></div>
      <div id="calDetail"></div>
    </div>

    <nav class="tabs">
      <button class="tabBtn active" data-tab="resumen"><span class="ic">🔥</span>Resumen</button>
      <button class="tabBtn" data-tab="practicar"><span class="ic">🙏</span>Practicar</button>
      <button class="tabBtn" data-tab="registrar"><span class="ic">✍️</span>Registrar</button>
      <button class="tabBtn" data-tab="calendario"><span class="ic">📅</span>Calendario</button>
    </nav>
  </div>

<script src="data.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
